<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Product Store</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-2">Customer</span>
                <a class="nav-link" th:href="@{/}">Home</a>
                <a class="nav-link" th:href="@{/cart}">Cart</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-link nav-link">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>My Orders</h1>

        <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">
            You haven't placed any orders yet.
        </div>

        <div th:if="${!#lists.isEmpty(orders)}">
            <div th:each="order : ${orders}" class="card mb-3">
                <div class="card-header">
                    <strong>Order #<span th:text="${order.id}"></span></strong>
                    <span class="float-end" th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}"></span>
                </div>
                <div class="card-body">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Quantity</th>
                                <th>Price</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="detail : ${order.orderDetails}">
                                <td th:text="${detail.product.name}"></td>
                                <td th:text="${detail.quantity}"></td>
                                <td>$<span th:text="${#numbers.formatDecimal(detail.price, 1, 2)}"></span></td>
                                <td>$<span th:text="${#numbers.formatDecimal(detail.price * detail.quantity, 1, 2)}"></span></td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="3" class="text-end"><strong>Order Total:</strong></td>
                                <td><strong>$<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span></strong></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
