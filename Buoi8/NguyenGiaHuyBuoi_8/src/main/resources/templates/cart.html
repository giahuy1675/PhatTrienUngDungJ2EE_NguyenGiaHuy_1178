<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Product Store</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-2">Customer</span>
                <a class="nav-link" th:href="@{/}">Home</a>
                <a class="nav-link" th:href="@{/orders}">Orders</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-link nav-link">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Shopping Cart</h1>

        <div th:if="${#lists.isEmpty(cart)}" class="alert alert-info">
            Your cart is empty.
            <a href="/" class="alert-link">Continue shopping</a>
        </div>

        <div th:if="${!#lists.isEmpty(cart)}">
            <table class="table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cart}">
                        <td th:text="${item.productName}"></td>
                        <td>$<span th:text="${#numbers.formatDecimal(item.price, 1, 2)}"></span></td>
                        <td>
                            <form th:action="@{/cart/update}" method="post" class="d-inline">
                                <input type="hidden" name="productId" th:value="${item.productId}">
                                <input type="number" name="quantity" th:value="${item.quantity}" min="1" class="form-control" style="width: 80px; display: inline-block;">
                            </form>
                        </td>
                        <td>$<span th:text="${#numbers.formatDecimal(item.total, 1, 2)}"></span></td>
                        <td>
                            <form th:action="@{/cart/remove}" method="post" class="d-inline">
                                <input type="hidden" name="productId" th:value="${item.productId}">
                                <button type="submit" class="btn btn-sm btn-danger">Remove</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3" class="text-end"><strong>Total:</strong></td>
                        <td><strong>$<span th:text="${#numbers.formatDecimal(total, 1, 2)}"></span></strong></td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>

            <div class="d-flex justify-content-between">
                <a href="/" class="btn btn-secondary">Continue Shopping</a>
                <a href="/checkout" class="btn btn-success">Checkout</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-submit form when quantity changes
        document.addEventListener('DOMContentLoaded', function() {
            const quantityInputs = document.querySelectorAll('input[name="quantity"]');
            quantityInputs.forEach(input => {
                input.addEventListener('change', function() {
                    // Find the form that contains this input and submit it
                    const form = this.closest('form');
                    if (form) {
                        form.submit();
                    }
                });
            });
        });
    </script>
</body>
</html>
