<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Product Store</a>
            <div class="navbar-nav ms-auto">
                <div sec:authorize="hasRole('USER')">
                    <a class="nav-link" th:href="@{/cart}">Cart</a>
                    <a class="nav-link" th:href="@{/orders}">Orders</a>
                </div>
                <div sec:authorize="hasRole('ADMIN')">
                    <span class="navbar-text me-2">Admin</span>
                    <a class="nav-link" th:href="@{/admin/products}">Admin</a>
                </div>
                <div sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-link nav-link">Logout</button>
                    </form>
                </div>
                <div sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <form th:action="@{/}" method="get" class="mb-4">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Search products...">
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="category">
                                <option value="">All Categories</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:selected="${cat.id == categoryId}" th:text="${cat.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="sort">
                                <option value="">Default</option>
                                <option value="price_asc" th:selected="${sort == 'price_asc'}">Price: Low to High</option>
                                <option value="price_desc" th:selected="${sort == 'price_desc'}">Price: High to Low</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">Search</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="row">
            <div th:each="product : ${products}" class="col-md-4 mb-4">
                <div class="card" style="width: 18rem;">
                    <img th:if="${product.imageName != null and !product.imageName.isEmpty()}" th:src="@{/admin/images/{name}(name=${product.imageName})}" class="card-img-top" alt="Product Image" style="height: 200px; object-fit: cover;">
                    <img th:if="${product.imageName == null or product.imageName.isEmpty()}" src="https://via.placeholder.com/200x200?text=No+Image" class="card-img-top" alt="No Image Available" style="height: 200px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${product.name}"></h5>
                        <p class="card-text" th:text="${product.description}"></p>
                        <p class="card-text"><strong>$<span th:text="${#numbers.formatDecimal(product.price, 1, 2)}"></span></strong></p>
                        <div sec:authorize="hasRole('USER')">
                            <form th:action="@{/cart/add}" method="post" class="d-inline">
                                <input type="hidden" name="productId" th:value="${product.id}">
                                <input type="number" name="quantity" value="1" min="1" class="form-control mb-2" style="width: 80px; display: inline-block;">
                                <button type="submit" class="btn btn-success">Add to Cart</button>
                            </form>
                        </div>
                        <div sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/admin/products/edit/{id}(id=${product.id})}" class="btn btn-warning">Edit</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/(keyword=${keyword}, category=${categoryId}, sort=${sort}, page=${currentPage - 1})}" th:if="${currentPage > 0}">Previous</a>
                    <span class="page-link" th:if="${currentPage == 0}">Previous</span>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/(keyword=${keyword}, category=${categoryId}, sort=${sort}, page=${i})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/(keyword=${keyword}, category=${categoryId}, sort=${sort}, page=${currentPage + 1})}" th:if="${currentPage + 1 < totalPages}">Next</a>
                    <span class="page-link" th:if="${currentPage + 1 == totalPages}">Next</span>
                </li>
            </ul>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
