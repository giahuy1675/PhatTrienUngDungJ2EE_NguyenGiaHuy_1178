<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Product Store - Admin</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-2">Admin Panel</span>
                <a class="nav-link" th:href="@{/admin/categories}">Categories</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-link nav-link">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Products Management</h1>
            <a href="/admin/products/add" class="btn btn-primary">Add Product</a>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}"></td>
                    <td>
                        <img th:if="${product.imageName != null and !product.imageName.isEmpty()}" th:src="@{/admin/images/{name}(name=${product.imageName})}" alt="Product Image" style="width: 50px; height: 50px; object-fit: cover;">
                        <span th:if="${product.imageName == null or product.imageName.isEmpty()}">No Image</span>
                    </td>
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.description}"></td>
                    <td>$<span th:text="${#numbers.formatDecimal(product.price, 1, 2)}"></span></td>
                    <td th:text="${product.category?.name}"></td>
                    <td>
                        <a th:href="@{/admin/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-warning">Edit</a>
                        <a th:href="@{/admin/products/delete/{id}(id=${product.id})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure?')">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <nav aria-label="Page navigation" th:if="${totalPages > 1}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/products(page=${currentPage - 1})}" th:if="${currentPage > 0}">Previous</a>
                    <span class="page-link" th:if="${currentPage == 0}">Previous</span>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/admin/products(page=${i})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/products(page=${currentPage + 1})}" th:if="${currentPage + 1 < totalPages}">Next</a>
                    <span class="page-link" th:if="${currentPage + 1 == totalPages}">Next</span>
                </li>
            </ul>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
