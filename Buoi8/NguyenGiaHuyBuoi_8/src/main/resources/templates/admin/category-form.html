<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Category Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Product Store - Admin</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-2">Admin Panel</span>
                <a class="nav-link" th:href="@{/admin/products}">Products</a>
                <a class="nav-link" th:href="@{/admin/categories}">Categories</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-link nav-link">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 th:text="${category.id != null} ? 'Edit Category' : 'Add Category'"></h1>

        <form th:action="@{/admin/categories/save}" method="post" th:object="${category}">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" th:field="*{name}" required>
            </div>

            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/admin/categories" class="btn btn-secondary">Cancel</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
