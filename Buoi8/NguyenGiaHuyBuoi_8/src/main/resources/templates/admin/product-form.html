<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Product Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Product Store - Admin</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-2">Admin Panel</span>
                <a class="nav-link" th:href="@{/admin/products}">Products</a>
                <a class="nav-link" th:href="@{/admin/categories}">Categories</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-link nav-link">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 th:text="${product.id != null} ? 'Edit Product' : 'Add Product'"></h1>

        <form th:action="@{/admin/products/save}" method="post" enctype="multipart/form-data" th:object="${product}">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" th:field="*{name}" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label for="price" class="form-label">Price</label>
                <input type="number" step="0.01" class="form-control" id="price" th:field="*{price}" required>
            </div>

            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" name="categoryId" required>
                    <option value="">Select Category</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${product.category != null and product.category.id == cat.id}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label for="imageFile" class="form-label">Image</label>
                <input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/*">
                <div th:if="${product.imageName != null and !product.imageName.isEmpty()}" class="mt-2">
                    <small class="text-muted">Current image: <span th:text="${product.imageName}"></span></small>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/admin/products" class="btn btn-secondary">Cancel</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
