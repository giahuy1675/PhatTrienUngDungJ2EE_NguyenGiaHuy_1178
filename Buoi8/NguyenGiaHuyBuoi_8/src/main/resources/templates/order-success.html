<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Product Store</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-2">Customer</span>
                <a class="nav-link" th:href="@{/}">Home</a>
                <a class="nav-link" th:href="@{/orders}">Orders</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-link nav-link">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="alert alert-success">
            <h4 class="alert-heading">Order Placed Successfully!</h4>
            <p>Your order has been placed successfully. Order ID: <strong th:text="${order.id}"></strong></p>
            <p>Total Amount: <strong>$<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span></strong></p>
        </div>

        <div class="row">
            <div class="col-md-6">
                <h3>Order Details</h3>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Quantity</th>
                            <th>Price</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="detail : ${order.orderDetails}">
                            <td th:text="${detail.product.name}"></td>
                            <td th:text="${detail.quantity}"></td>
                            <td>$<span th:text="${#numbers.formatDecimal(detail.price, 1, 2)}"></span></td>
                            <td>$<span th:text="${#numbers.formatDecimal(detail.price * detail.quantity, 1, 2)}"></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <a href="/" class="btn btn-primary">Continue Shopping</a>
        <a href="/orders" class="btn btn-secondary">View All Orders</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
