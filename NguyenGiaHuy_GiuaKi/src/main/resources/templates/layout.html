<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <title>Course Registration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header class="bg-dark">
    <div class="container py-3 d-flex align-items-center gap-3">
        <a class="text-white text-decoration-none fw-bold" th:href="@{/home}">Course Registration</a>
        <form class="d-flex align-items-center gap-2 ms-auto" th:action="@{/home}" method="get">
            <input class="form-control" type="text" name="keyword" placeholder="Search course" th:value="${keyword}">
            <button class="btn btn-primary" type="submit">Search</button>
        </form>
        <nav class="d-flex align-items-center gap-2">
            <a class="text-white text-decoration-none" th:href="@{/home}">Home</a>
            <a class="text-white text-decoration-none" sec:authorize="hasRole('STUDENT')" th:href="@{/my-courses}">My Courses</a>
            <a class="text-white text-decoration-none" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/courses}">Courses(Admin)</a>
            <a class="text-white text-decoration-none" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/categories}">Categories(Admin)</a>
            <a class="text-white text-decoration-none" sec:authorize="isAnonymous()" th:href="@{/login}">Login</a>
            <a class="text-white text-decoration-none" sec:authorize="isAnonymous()" th:href="@{/register}">Register</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-link text-white p-0">Logout</button>
            </form>
        </nav>
    </div>
</header>
<main class="container my-4" th:replace="${content}"></main>
</body>
</html>
