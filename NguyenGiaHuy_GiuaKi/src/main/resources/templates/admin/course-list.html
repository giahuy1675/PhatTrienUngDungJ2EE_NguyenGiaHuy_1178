<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Manage Courses</h2>
        <a class="btn btn-primary" th:href="@{/admin/courses/create}">Create Course</a>
    </div>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Name</th>
            <th>Credits</th>
            <th>Lecturer</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.name}">Name</td>
            <td th:text="${course.credits}">3</td>
            <td th:text="${course.lecturer}">Lecturer</td>
            <td>
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/courses/edit/{id}(id=${course.id})}">Edit</a>
                <form th:action="@{/admin/courses/delete/{id}(id=${course.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
