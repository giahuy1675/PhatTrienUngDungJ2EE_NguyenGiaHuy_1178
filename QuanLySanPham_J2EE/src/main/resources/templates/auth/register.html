<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <title>Đăng ký</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-success text-white text-center py-3">
                        <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>Đăng Ký Tài Khoản</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/register}" th:object="${user}" method="post">

                            <!-- Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Tên đăng nhập</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                    <input type="text" id="username" th:field="*{username}"
                                           class="form-control" th:classappend="${#fields.hasErrors('username') or usernameError != null} ? 'is-invalid'"
                                           placeholder="Nhập tên đăng nhập"/>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}"
                                     th:errors="*{username}"></div>
                                <div class="text-danger small mt-1" th:if="${usernameError}"
                                     th:text="${usernameError}"></div>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" id="email" th:field="*{email}"
                                           class="form-control" th:classappend="${#fields.hasErrors('email') or emailError != null} ? 'is-invalid'"
                                           placeholder="Nhập email"/>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}"></div>
                                <div class="text-danger small mt-1" th:if="${emailError}"
                                     th:text="${emailError}"></div>
                            </div>

                            <!-- Password -->
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" id="password" th:field="*{password}"
                                           class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                           placeholder="Nhập mật khẩu"/>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}"
                                     th:errors="*{password}"></div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="fas fa-user-plus me-1"></i>Đăng Ký
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center py-3">
                        <span class="text-muted">Đã có tài khoản? </span>
                        <a th:href="@{/login}" class="fw-semibold">Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
