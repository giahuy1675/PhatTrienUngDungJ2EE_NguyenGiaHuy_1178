<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <title>Đăng nhập</title>
    <style>
        .divider:after,
        .divider:before {
            content: "";
            flex: 1;
            height: 1px;
            background: #eee;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <section class="vh-100">
        <div class="container py-5 h-100">
            <div class="row d-flex align-items-center justify-content-center h-100">

                <!-- Ảnh minh họa -->
                <div class="col-md-8 col-lg-7 col-xl-6">
                    <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.svg"
                         class="img-fluid" alt="Login illustration"/>
                </div>

                <!-- Form đăng nhập -->
                <div class="col-md-7 col-lg-5 col-xl-5 offset-xl-1">

                    <!-- Thông báo lỗi -->
                    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-circle me-1"></i>
                        <span th:text="${errorMsg}"></span>
                        <button type="button" class="btn-close" data-mdb-dismiss="alert"></button>
                    </div>

                    <!-- Thông báo đăng xuất -->
                    <div th:if="${logoutMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="fas fa-check-circle me-1"></i>
                        <span th:text="${logoutMsg}"></span>
                        <button type="button" class="btn-close" data-mdb-dismiss="alert"></button>
                    </div>

                    <!-- Thông báo đăng ký thành công -->
                    <div th:if="${param.registered}" class="alert alert-success" role="alert">
                        <i class="fas fa-check-circle me-1"></i>
                        Đăng ký thành công! Vui lòng đăng nhập.
                    </div>

                    <form th:action="@{/login}" method="post">

                        <!-- Username -->
                        <div data-mdb-input-init class="form-outline mb-4">
                            <input type="text" id="username" name="username"
                                   class="form-control form-control-lg" required autofocus/>
                            <label class="form-label" for="username">Tên đăng nhập</label>
                        </div>

                        <!-- Password -->
                        <div data-mdb-input-init class="form-outline mb-4">
                            <input type="password" id="password" name="password"
                                   class="form-control form-control-lg" required/>
                            <label class="form-label" for="password">Mật khẩu</label>
                        </div>

                        <div class="d-flex justify-content-around align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="" id="rememberMe"/>
                                <label class="form-check-label" for="rememberMe">Ghi nhớ đăng nhập</label>
                            </div>
                            <a href="#!">Quên mật khẩu?</a>
                        </div>

                        <!-- Submit -->
                        <button type="submit" data-mdb-button-init data-mdb-ripple-init
                                class="btn btn-primary btn-lg btn-block w-100">
                            <i class="fas fa-sign-in-alt me-1"></i>Đăng Nhập
                        </button>

                        <div class="divider d-flex align-items-center my-4">
                            <p class="text-center fw-bold mx-3 mb-0 text-muted">HOẶC</p>
                        </div>

                        <div class="text-center">
                            <span class="text-muted">Chưa có tài khoản? </span>
                            <a th:href="@{/register}" class="fw-semibold">Đăng ký ngay</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </section>
</div>
</body>
</html>
