<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{_layout}">
<head>
    <title>Thêm sản phẩm</title>
</head>
<body>
<div layout:fragment="content" class="container body-content">
    <form th:action="@{/products/create}" th:object="${product}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="name">Name</label>
            <input class="form-control" type="text" th:field="*{name}" id="name" placeholder="product name"/>
            <div class="alert alert-warning" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="form-group">
            <label for="price">Price</label>
            <input class="form-control" type="text" id="price" name="price" placeholder="price" oninput="formatPrice(this)"/>
            <div class="alert alert-warning" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>
        <div class="form-group">
            <label for="image">Image</label>
            <input class="form-control" type="file" id="image" name="imageProduct" accept="image/png,image/jpeg" onchange="previewImage(event)"/>
            <div class="alert alert-warning" th:if="${#fields.hasErrors('image')}" th:errors="*{image}"></div>
            <div class="mt-2">
                <img id="preview" src="#" alt="Preview Image" style="max-width: 200px; display: none;"/>
            </div>
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <select th:field="*{category.id}" class="form-control" id="category">
                <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
            </select>
            <div class="alert alert-warning" th:if="${#fields.hasErrors('category')}"></div>
        </div>
        <input type="submit" class="btn btn-light" data-mdb-ripple-init data-mdb-ripple-color="dark" value="Add Product"/>
    </form>
</div>
</body>
<script>
    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById('preview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        } else {
            preview.src = '#';
            preview.style.display = 'none';
        }
    }

    function formatPrice(input) {
        let value = input.value.replace(/,/g, '');
        if (!isNaN(value) && value.length > 0) {
            input.value = Number(value).toLocaleString('en-US');
        } else {
            input.value = value.replace(/[^0-9]/g, '');
        }
    }

    // Loại bỏ dấu phẩy khi submit form
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form');
        form.addEventListener('submit', function(e) {
            const priceInput = document.getElementById('price');
            priceInput.value = priceInput.value.replace(/,/g, '');
        });
    });
</script>
</html>
