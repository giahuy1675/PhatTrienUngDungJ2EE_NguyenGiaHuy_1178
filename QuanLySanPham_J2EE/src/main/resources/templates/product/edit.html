<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{_layout}">
<head>
    <title>Chỉnh sửa sản phẩm</title>
</head>
<body>
<div layout:fragment="content">
    <h2>Chỉnh sửa sản phẩm</h2>
    <form th:action="@{/products/edit}" th:object="${product}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}"/>
        <div class="mb-3">
            <label>Tên sản phẩm</label>
            <input type="text" th:field="*{name}" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label>Giá</label>
            <input type="number" th:field="*{price}" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>
        <div class="mb-3">
            <label>Hình ảnh</label>
            <input type="file" name="imageProduct" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('image')}" th:errors="*{image}"></div>
            <div th:if="${product.image != null}">
                <img th:src="@{'/images/' + ${product.image}}" style="max-width: 100px;"/>
            </div>
        </div>
        <div class="mb-3">
            <label>Loại danh mục</label>
            <select th:field="*{category.id}" class="form-control">
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-light" data-mdb-ripple-init data-mdb-ripple-color="dark">Cập nhật</button>
        <a th:href="@{/products}" class="btn btn-dark" data-mdb-ripple-init>Quay lại</a>
    </form>
</div>
</body>
</html>
